[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skillproof-kit"
version = "0.1.0"
description = "Check, document, visualize, and package Agent Skills for coding assistants."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "SkillProof Kit contributors"}]
dependencies = ["PyYAML>=6.0.2,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
skillproof = "skillproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
